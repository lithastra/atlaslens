services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: atlaslens

  # Service name must be atlaslens-backend: the frontend image's nginx
  # proxies the API to http://atlaslens-backend:8000.
  atlaslens-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ATLASLENS_MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - atlaslens-backend

volumes:
  mongo-data:
