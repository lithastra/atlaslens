apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlaslens.fullname" . }}-backend
  labels:
    {{- include "atlaslens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "atlaslens.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlaslens.fullname" . }}-backend
  labels:
    {{- include "atlaslens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "atlaslens.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "atlaslens.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "atlaslens.configMapName" . }}
          env:
            - name: ATLASLENS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: jwt-secret
            - name: ATLASLENS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: encryption-key
            - name: ATLASLENS_ATLASSIAN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: atlassian-email
            - name: ATLASLENS_JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: jira-api-token
            - name: ATLASLENS_CONFLUENCE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: confluence-api-token
            - name: ATLASLENS_BITBUCKET_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: bitbucket-api-token
            - name: ATLASLENS_ATLASSIAN_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: atlassian-oauth-client-id
            - name: ATLASLENS_ATLASSIAN_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlaslens.secretName" . }}
                  key: atlassian-oauth-client-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
