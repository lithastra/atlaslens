{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlaslens.secretName" . }}
  labels:
    {{- include "atlaslens.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
  atlassian-email: {{ .Values.secrets.atlassianEmail | quote }}
  jira-api-token: {{ .Values.secrets.jiraApiToken | quote }}
  confluence-api-token: {{ .Values.secrets.confluenceApiToken | quote }}
  bitbucket-api-token: {{ .Values.secrets.bitbucketApiToken | quote }}
  atlassian-oauth-client-id: {{ .Values.secrets.atlassianOauthClientId | quote }}
  atlassian-oauth-client-secret: {{ .Values.secrets.atlassianOauthClientSecret | quote }}
{{- end }}
