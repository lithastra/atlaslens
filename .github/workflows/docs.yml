name: Docs build

# Validates the docs build (mkdocs --strict) on changes under docs/.
# Deployment is handled by Cloudflare Pages (Git integration), not here.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Build site (strict)
        working-directory: docs
        run: mkdocs build --strict
