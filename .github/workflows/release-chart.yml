name: Release

# On a version tag (e.g. v1.2.0) — or a manual run — build and push the
# backend/frontend images and the Helm chart to GHCR as OCI artifacts.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v). Defaults to Chart.yaml."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - name: Resolve and validate version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(helm show chart charts/atlaslens | awk '/^version:/ {print $2}')"
          fi
          # Reject anything that is not a SemVer-shaped version — guards against
          # injection via the manual-dispatch input and malformed tags.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION' (expected SemVer like 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

  images:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push backend + frontend images
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          BE="ghcr.io/${OWNER_LC}/atlaslens-backend"
          FE="ghcr.io/${OWNER_LC}/atlaslens-frontend"
          docker build -t "${BE}:${VERSION}" -t "${BE}:latest" -f backend/Dockerfile .
          docker build -t "${FE}:${VERSION}" -t "${FE}:latest" frontend
          docker push "${BE}:${VERSION}"
          docker push "${BE}:latest"
          docker push "${FE}:${VERSION}"
          docker push "${FE}:latest"
          {
            echo "### Images published :package:"
            echo ""
            echo "- \`${BE}:${VERSION}\`"
            echo "- \`${FE}:${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0
      - name: Lint chart
        run: helm lint charts/atlaslens
      - name: Package chart
        run: |
          set -euo pipefail
          helm package charts/atlaslens \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push chart to GHCR
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/atlaslens-${VERSION}.tgz" "oci://ghcr.io/${OWNER_LC}/charts"
          {
            echo "### Helm chart published :ship:"
            echo ""
            echo '```bash'
            echo "helm upgrade --install atlaslens oci://ghcr.io/${OWNER_LC}/charts/atlaslens --version ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
